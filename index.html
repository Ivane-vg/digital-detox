<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Détox — Digital detox</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#f3f6ff;--bg2:#dce6fb;--card:rgba(255,255,255,.6);--edge:rgba(255,255,255,.9);--text:#0b1030;--muted:#5d6a8c;--acc:#2f6bff;--acc2:#3a3fe0;--sh:#b4c3ec;--field:#e7edfc;--ok:#1f9d6b;--warn:#e0614f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0b1126;--bg2:#141d40;--card:rgba(32,44,92,.55);--edge:rgba(130,160,255,.2);--text:#eef2ff;--muted:#9aa8d0;--sh:#040716;--field:#18234b;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#0b1126;--bg2:#141d40;--card:rgba(32,44,92,.55);--edge:rgba(130,160,255,.2);--text:#eef2ff;--muted:#9aa8d0;--sh:#040716;--field:#18234b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow-x:hidden;position:relative}
.blob{position:fixed;border-radius:50%;background:linear-gradient(145deg,rgba(120,150,255,.28),rgba(255,255,255,.15));box-shadow:inset 0 0 0 2px var(--edge);z-index:0;pointer-events:none}
.b1{width:260px;height:260px;left:-120px;top:-110px}.b2{width:150px;height:150px;right:-70px;top:30%}.b3{width:300px;height:300px;right:-130px;bottom:-130px}
.view{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:28px 22px 40px}
.icon-btn{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:5;width:46px;height:46px;border-radius:16px;border:1px solid var(--edge);background:var(--card);backdrop-filter:blur(10px);color:var(--text);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 20px -10px var(--sh)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.logo-box{width:150px;height:150px;margin:34px auto 22px;border-radius:44px;background:var(--card);border:1px solid var(--edge);backdrop-filter:blur(12px);display:grid;place-items:center;box-shadow:0 24px 40px -22px var(--sh),inset 0 2px 6px rgba(255,255,255,.5)}
h1{font-size:2.1rem;font-weight:800;text-align:center;margin:0;letter-spacing:-.02em}
.sub{text-align:center;color:var(--muted);letter-spacing:.2em;margin:8px 0 28px;font-size:.95rem}
.field{display:flex;align-items:center;gap:12px;height:62px;padding:0 18px;margin-bottom:14px;border-radius:20px;background:var(--field);border:1px solid var(--edge);box-shadow:inset 0 2px 6px rgba(120,140,200,.15),0 8px 16px -12px var(--sh);color:var(--muted)}
.field input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:1rem;color:var(--text);outline:0}
.field input::placeholder{color:var(--muted)}
.field:focus-within{border-color:var(--acc)}
.eye{border:0;background:none;cursor:pointer;color:var(--muted);display:grid;padding:4px}
.row{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 18px}
.chk{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.95rem}
.chk input{position:absolute;opacity:0}
.chk i{width:28px;height:28px;border-radius:9px;background:var(--field);border:1px solid var(--edge);display:grid;place-items:center;color:transparent}
.chk input:checked+i{background:var(--acc);color:#fff}
.chk input:focus-visible+i{outline:3px solid var(--acc);outline-offset:2px}
.link{color:var(--acc);font-weight:600;background:none;border:0;cursor:pointer;font-size:.95rem}
.btn{width:100%;height:62px;border-radius:31px;border:1px solid rgba(255,255,255,.4);background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;font-weight:600;font-size:1.15rem;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;box-shadow:0 14px 30px -10px rgba(47,107,255,.7)}
.btn .go{position:absolute;right:10px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center}
.btn.sm{height:46px;font-size:1rem;width:auto;padding:0 22px;border-radius:23px}
.msg{min-height:22px;color:var(--warn);font-size:.9rem;text-align:center;margin:0 0 10px}
.or{display:flex;align-items:center;gap:14px;color:var(--muted);letter-spacing:.18em;font-size:.78rem;margin:26px 0 18px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--acc);opacity:.45}
.soc{display:flex;justify-content:center;gap:18px}
.soc button{width:76px;height:76px;border-radius:24px;border:1px solid var(--edge);background:var(--card);backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;box-shadow:0 12px 20px -14px var(--sh)}
.foot{margin-top:34px;text-align:center;color:var(--muted);letter-spacing:.16em;font-size:.78rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 56px 18px 0}
.top h2{font-size:1.3rem;margin:0}
.tabs{display:flex;gap:6px;padding:6px;border-radius:22px;background:var(--card);border:1px solid var(--edge);margin-bottom:18px}
.tabs button{flex:1;height:44px;border:0;border-radius:16px;background:none;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff}
.card{background:var(--card);border:1px solid var(--edge);border-radius:26px;padding:20px;margin-bottom:16px;backdrop-filter:blur(10px);box-shadow:0 18px 30px -22px var(--sh)}
.card h3{margin:0 0 6px;font-size:1.1rem}
.card p{margin:0 0 12px;color:var(--muted);line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--edge);border-radius:20px;padding:14px 8px;text-align:center}
.stat b{display:block;font-size:1.6rem}.stat span{color:var(--muted);font-size:.8rem}
.inl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inl .field{flex:1;min-width:120px;height:50px;margin:0;border-radius:16px}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.72rem;color:var(--muted);gap:4px}
.bar i{width:100%;border-radius:8px;background:var(--acc);min-height:4px}.bar i.over{background:var(--warn)}
.ch{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--edge)}
.ch:first-of-type{border-top:0}.ch b{display:block}.ch span{color:var(--muted);font-size:.85rem}
.tag{margin-left:auto;font-size:.75rem;padding:4px 10px;border-radius:12px;background:var(--field);white-space:nowrap}
.tag.on{background:var(--acc);color:#fff}.tag.done{background:var(--ok);color:#fff}
textarea{width:100%;min-height:80px;border-radius:16px;border:1px solid var(--edge);background:var(--field);color:var(--text);font:inherit;padding:12px;resize:vertical;margin-bottom:10px}
.post b{font-size:.95rem}.post p{margin:4px 0 8px;color:var(--text)}
.like{border:1px solid var(--edge);background:var(--field);border-radius:14px;padding:6px 12px;cursor:pointer;font-size:.85rem}
.like.on{background:var(--acc);color:#fff}
.note{color:var(--muted);font-size:.8rem;text-align:center;margin-top:8px}
@media (prefers-reduced-motion:no-preference){.btn,.like,.tabs button{transition:transform .15s}.btn:active{transform:scale(.98)}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<button class="icon-btn" id="theme" aria-label="Changer de thème"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg></button>

<main class="view" id="login">
  <div class="logo-box"><svg width="90" height="90" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a63ff"/><stop offset="1" stop-color="#1a2fb8"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8bff"/><stop offset="1" stop-color="#2a55e6"/></linearGradient><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#c6d4f7"/></linearGradient></defs>
  <path d="M0-30C18-18 18 18 0 30C-18 18-18-18 0-30Z" transform="translate(32 62) rotate(28)" fill="url(#g1)"/>
  <path d="M0-30C18-18 18 18 0 30C-18 18-18-18 0-30Z" transform="translate(50 50) rotate(28)" fill="url(#g2)"/>
  <path d="M0-30C18-18 18 18 0 30C-18 18-18-18 0-30Z" transform="translate(68 36) rotate(28)" fill="url(#g3)"/></svg></div>
  <h1>Digital détox</h1>
  <p class="sub">Connectez-vous pour continuer</p>
  <div class="field"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg><input id="u" placeholder="Pseudo ou e-mail" autocomplete="username" aria-label="Pseudo ou e-mail"></div>
  <div class="field"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="p" type="password" placeholder="Mot de passe" autocomplete="current-password" aria-label="Mot de passe"><button class="eye" id="eye" aria-label="Afficher le mot de passe"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <div class="row"><label class="chk"><input type="checkbox" id="rem" checked><i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></i>Rester connecté</label><button class="link" id="forgot">Mot de passe oublié ?</button></div>
  <p class="msg" id="msg" role="alert"></p>
  <button class="btn" id="go">Se connecter<span class="go"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
  <p class="note"><span id="q">Pas encore de compte ?</span> <button class="link" id="swap" type="button">Créer un compte</button></p>
  <div class="or">OU CONTINUER AVEC</div>
  <div class="soc">
    <button data-p="Google" aria-label="Continuer avec Google"><svg width="34" height="34" viewBox="0 0 48 48"><path fill="#4285F4" d="M45 24.5c0-1.6-.1-3-.4-4.5H24v8.5h11.8c-.5 2.7-2 5-4.4 6.600v5.500h7.100C42.600 36.200 45 30.900 45 24.500z"/><path fill="#34A853" d="M24 46c6 0 11-2 14.500-5.400l-7.100-5.500c-2 1.300-4.500 2.100-7.400 2.100-5.700 0-10.600-3.900-12.300-9.100H4.400v5.700C8 41.800 15.400 46 24 46z"/><path fill="#FBBC05" d="M11.700 28.100c-.9-2.700-.9-5.600 0-8.300v-5.700H4.400c-3.100 6.100-3.100 13.600 0 19.700z"/><path fill="#EA4335" d="M24 10.800c3.200 0 6.100 1.100 8.400 3.300l6.300-6.300C34.900 4.300 29.900 2 24 2 15.400 2 8 6.200 4.400 12.100l7.300 5.700c1.700-5.200 6.600-7 12.300-7z"/></svg></button>
    <button data-p="Facebook" aria-label="Continuer avec Facebook"><svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#1877F2"/><path d="M22 33V22h3.500l.6-4H22v-2.500c0-1.200.5-2 2.100-2H26V10.100C25.600 10 24.400 10 23.100 10 20 10 18 11.800 18 15.200V18h-3.500v4H18v11z" fill="#fff"/></svg></button>
  </div>
  <p class="foot">DÉCONNECTER • PROGRESSER • ENSEMBLE</p>
</main>

<main class="view" id="app" hidden>
  <div class="top"><h2 id="hello"></h2><button class="link" id="out">Déconnexion</button></div>
  <div class="tabs" role="tablist"><button role="tab" data-t="home" aria-selected="true">Accueil</button><button role="tab" data-t="chal" aria-selected="false">Défis</button><button role="tab" data-t="com" aria-selected="false">Communauté</button></div>
  <section id="t-home"></section><section id="t-chal" hidden></section><section id="t-com" hidden></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
var KEY="detox-v1",$=function(s){return document.querySelector(s)};
var CH=[["Zéro écran 1 h avant de dormir","Posez le téléphone une heure avant le coucher."],["Téléphone hors de la chambre","Laissez-le charger dans une autre pièce toute la nuit."],["Un repas sans écran par jour","Mangez sans téléphone ni télévision."],["Coupez les notifications","Désactivez-les pour les réseaux sociaux."],["30 minutes dehors sans téléphone","Marchez, discutez, regardez autour de vous."],["Un dimanche sans réseaux","Une journée entière hors des réseaux sociaux."]];
var S={user:null,goal:4,logs:{},done:{},posts:[{n:"Aïcha",t:"Jour 5 sans téléphone au lit. Je dors beaucoup mieux.",l:3},{n:"Kouamé",t:"Objectif de la semaine atteint : 3 h 30 d’écran par jour.",l:5}],liked:{}};
/* === CONFIGURATION : collez ici les deux valeurs de Supabase (Project Settings > API) === */
var SUPABASE_URL="https://oxmrlnmbnqkxffpfwgjd.supabase.co",SUPABASE_KEY="sb_publishable_kS5iczPy6SKTQYmf1BvB0A_ECYlwbbd";
var sb=null;try{if(window.supabase&&SUPABASE_URL.indexOf("http")===0&&SUPABASE_KEY.length>40)sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}
function nameOf(u){var m=u.user_metadata||{};return m.full_name||m.name||(u.email||"").split("@")[0]||"Ami"}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||"null");if(d){for(var k in d)S[k]=d[k]}}catch(e){}}
function save(){try{var c=JSON.parse(JSON.stringify(S));if(!c.remember)c.user=null;localStorage.setItem(KEY,JSON.stringify(c))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function day(o){var d=new Date();d.setDate(d.getDate()-o);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function streak(){var n=0,o=S.logs[day(0)]==null?1:0;for(;;o++){var v=S.logs[day(o)];if(v==null||v>S.goal)break;n++}return n}
function wk(){return Math.floor((Date.now()/86400000+3)/7)%CH.length}
function fmt(h){return String(h).replace(".",",")}

/* thème */
function theme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("detox-theme",t)}catch(e){}}
try{var th=localStorage.getItem("detox-theme");if(th)theme(th)}catch(e){}
$("#theme").onclick=function(){var d=document.documentElement.getAttribute("data-theme");var dark=d?d==="dark":matchMedia("(prefers-color-scheme:dark)").matches;theme(dark?"light":"dark")};

/* connexion */
var mode="in";
function kv(st,k,v){try{return v==null?st.getItem(k):st.setItem(k,v)}catch(e){}}
function say(t,ok){var m=$("#msg");m.style.color=ok?"var(--ok)":"var(--warn)";m.textContent=t}
function setMode(x){mode=x;var up=x==="up";$("#go").firstChild.nodeValue=up?"Créer mon compte":"Se connecter";$("#swap").textContent=up?"Se connecter":"Créer un compte";$("#q").textContent=up?"Déjà un compte ?":"Pas encore de compte ?";$("#msg").textContent=""}
function trad(t){t=String(t);if(/Invalid login/i.test(t))return"E-mail ou mot de passe incorrect.";if(/not confirmed/i.test(t))return"Confirmez d’abord votre e-mail.";if(/already registered/i.test(t))return"Cet e-mail a déjà un compte. Connectez-vous.";return t}
function enter(name,rem){S.user=name;S.remember=rem;save();show()}
$("#swap").onclick=function(){setMode(mode==="in"?"up":"in")};
$("#eye").onclick=function(){var p=$("#p");p.type=p.type==="password"?"text":"password"};
$("#forgot").onclick=function(){var u=$("#u").value.trim();
if(!sb){say("Service de connexion non configuré : ajoutez vos clés Supabase dans le fichier.");return}
if(u.indexOf("@")<0){say("Entrez d’abord votre e-mail dans le premier champ.");return}
sb.auth.resetPasswordForEmail(u,{redirectTo:location.href.split("#")[0]}).then(function(r){r.error?say(trad(r.error.message)):say("E-mail envoyé : ouvrez le lien pour choisir un nouveau mot de passe.",1)}).catch(function(){say("Réseau indisponible. Réessayez.")})};
$("#go").onclick=function(){var u=$("#u").value.trim(),p=$("#p").value,rem=$("#rem").checked;
if(!u){say("Entrez votre pseudo ou votre e-mail.");return}
if(p.length<6){say("Le mot de passe doit avoir au moins 6 caractères.");return}
if(!sb){say("Service de connexion non configuré : ajoutez vos clés Supabase dans le fichier.");return}
if(u.indexOf("@")<0){say("Avec un vrai compte, utilisez votre e-mail.");return}
kv(localStorage,"detox-rem",rem?"1":"0");kv(sessionStorage,"detox-live","1");
var f=mode==="in"?sb.auth.signInWithPassword({email:u,password:p}):sb.auth.signUp({email:u,password:p,options:{emailRedirectTo:location.href.split("#")[0]}});
f.then(function(r){if(r.error){say(trad(r.error.message));return}
if(mode==="up"){setMode("in");say("Compte créé. Confirmez votre e-mail, puis connectez-vous.",1)}}).catch(function(){say("Réseau indisponible. Réessayez.")})};
document.querySelectorAll(".soc button").forEach(function(b){b.onclick=function(){
if(!sb){say("Service de connexion non configuré : ajoutez vos clés Supabase dans le fichier.");return}
kv(localStorage,"detox-rem",$("#rem").checked?"1":"0");kv(sessionStorage,"detox-live","1");
sb.auth.signInWithOAuth({provider:b.dataset.p.toLowerCase(),options:{redirectTo:location.href.split("#")[0]}}).then(function(r){if(r.error)say("Connexion impossible : "+r.error.message)}).catch(function(){say("Réseau indisponible. Réessayez.")})}});
$("#out").onclick=function(){if(sb)sb.auth.signOut();S.user=null;S.remember=false;save();show()};
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){tab(b.dataset.t)}});
function tab(t){document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.t===t)});["home","chal","com"].forEach(function(k){$("#t-"+k).hidden=k!==t})}

function show(){var on=!!S.user;$("#login").hidden=on;$("#app").hidden=!on;if(on){$("#hello").textContent="Bonjour, "+S.user;render()}}

function render(){home();chal();com()}
function home(){var t=S.logs[day(0)],bars="",max=Math.max(S.goal*1.5,1);
for(var i=6;i>=0;i--){var v=S.logs[day(i)],d=new Date();d.setDate(d.getDate()-i);var l=d.toLocaleDateString("fr-FR",{weekday:"short"}).slice(0,3);
bars+='<div class="bar"><span>'+(v==null?"":fmt(v))+'</span><i class="'+(v>S.goal?"over":"")+'" style="height:'+(v==null?4:Math.min(100,v/Math.max(max,v)*100))+'%"></i><span>'+l+"</span></div>"}
$("#t-home").innerHTML='<div class="stats"><div class="stat"><b>'+streak()+'</b><span>jours de série</span></div><div class="stat"><b>'+(t==null?"–":fmt(t)+" h")+'</b><span>aujourd’hui</span></div><div class="stat"><b>'+fmt(S.goal)+' h</b><span>objectif par jour</span></div></div>'+
'<div class="card"><h3>Bilan du jour</h3><p>Combien d’heures avez-vous passées sur écran aujourd’hui ?</p><div class="inl"><label class="field"><input id="hv" type="number" min="0" max="24" step="0.5" placeholder="Heures" value="'+(t==null?"":t)+'" aria-label="Heures d’écran aujourd’hui"></label><button class="btn sm" id="hs">Enregistrer</button></div></div>'+
'<div class="card"><h3>7 derniers jours</h3><div class="chart">'+bars+'</div></div>'+
'<div class="card"><h3>Votre objectif</h3><p>Une série se compte quand vous restez sous votre objectif.</p><div class="inl"><label class="field"><input id="gv" type="number" min="1" max="16" step="0.5" value="'+S.goal+'" aria-label="Objectif en heures par jour"></label><button class="btn sm" id="gs">Modifier</button></div></div>';
$("#hs").onclick=function(){var v=parseFloat($("#hv").value);if(isNaN(v)||v<0||v>24)return;S.logs[day(0)]=v;save();home()};
$("#gs").onclick=function(){var v=parseFloat($("#gv").value);if(isNaN(v)||v<1||v>16)return;S.goal=v;save();home()}}
function chal(){var c=wk(),h='<div class="card"><h3>Défi de la semaine</h3><b>'+CH[c][0]+'</b><p>'+CH[c][1]+'</p><button class="btn sm" id="cd">'+(S.done[c]?"Défi relevé ✓":"Marquer comme relevé")+'</button></div><div class="card"><h3>Tous les défis</h3>';
CH.forEach(function(x,i){h+='<div class="ch"><div><b>'+x[0]+'</b><span>'+x[1]+'</span></div><span class="tag '+(S.done[i]?"done":i===c?"on":"")+'">'+(S.done[i]?"Relevé":i===c?"Cette semaine":"À venir")+"</span></div>"});
$("#t-chal").innerHTML=h+"</div>";
$("#cd").onclick=function(){S.done[c]=!S.done[c];save();chal()}}
function com(){var h='<div class="card"><h3>Partagez votre semaine</h3><textarea id="pt" maxlength="240" placeholder="Votre victoire, une astuce, une difficulté…" aria-label="Votre message"></textarea><button class="btn sm" id="pp">Publier</button></div><div class="card">';
S.posts.forEach(function(p,i){var on=S.liked[i];h+='<div class="post ch"><div><b>'+esc(p.n)+"</b><p>"+esc(p.t)+'</p><button class="like '+(on?"on":"")+'" data-i="'+i+'">♥ '+(p.l+(on?1:0))+"</button></div></div>"});
$("#t-com").innerHTML=h+'</div><p class="note">Démo : les messages restent sur cet appareil.</p>';
$("#pp").onclick=function(){var t=$("#pt").value.trim();if(!t)return;S.posts.unshift({n:S.user,t:t,l:0});S.liked={};save();com()};
document.querySelectorAll(".like").forEach(function(b){b.onclick=function(){var i=b.dataset.i;S.liked[i]=!S.liked[i];save();com()}})}

load();S.user=null;show();
if(!sb)say("Service de connexion non configuré : ajoutez vos clés Supabase dans le fichier.");
(function(){var h=location.hash||"";try{
if(/error_code=otp_expired/.test(h))say("Le lien de confirmation a expiré ou a déjà été utilisé. Essayez de vous connecter : votre compte est peut-être déjà confirmé. Sinon, cliquez sur « Créer un compte » pour recevoir un nouveau lien.");
else if(/error_description=/.test(h))say("Lien invalide : "+decodeURIComponent(h.match(/error_description=([^&]*)/)[1].replace(/\+/g," ")));
else if(/type=signup/.test(h))say("E-mail confirmé. Connexion en cours…",1)}catch(e){}})();
if(sb)sb.auth.onAuthStateChange(function(e,s){
if(e==="PASSWORD_RECOVERY"){var np=prompt("Nouveau mot de passe (6 caractères minimum) :");if(np&&np.length>=6)sb.auth.updateUser({password:np}).then(function(r){say(r.error?trad(r.error.message):"Mot de passe modifié.",!r.error)});return}
if(s&&s.user){var keep=kv(localStorage,"detox-rem")!=="0";
if(!keep&&!kv(sessionStorage,"detox-live")){sb.auth.signOut();return}
enter(nameOf(s.user),keep)}
else{S.user=null;show()}});
})();
</script>
</body>
</html>
